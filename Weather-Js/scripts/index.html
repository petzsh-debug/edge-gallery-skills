<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<script>
const METEOBLUE_URL = 'https://my.meteoblue.com/packages/basic-1h_basic-day?apikey=uf7AWT0t9lb3IeqZ&lat=56.8573&lon=60.6153&asl=278&format=json';

function isEkb(loc) {
  if (!loc) return true;
  const s = loc.toLowerCase().trim();
  return !s || s.includes('екатер') || s.includes('yekater') || s.includes('ekater') || s === 'екб' || s === 'ekb';
}

function degToCompass(deg) {
  const d = ['С','СВ','В','ЮВ','Ю','ЮЗ','З','СЗ'];
  return d[Math.round((deg % 360) / 45) % 8];
}

function dayName(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('ru', { weekday: 'short' });
}

function capitalize(s) {
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function fetchWithTimeout(url, ms) {
  return new Promise(function(resolve, reject) {
    var controller = new AbortController();
    var timer = setTimeout(function() { controller.abort(); }, ms);
    fetch(url, { signal: controller.signal })
      .then(function(r) { clearTimeout(timer); resolve(r); })
      .catch(function(e) { clearTimeout(timer); reject(e); });
  });
}

async function fetchMeteoblue() {
  var res = await fetchWithTimeout(METEOBLUE_URL, 7000);
  if (!res.ok) throw new Error('meteoblue ' + res.status);
  var j = await res.json();
  var h = j.data_1h;
  var day = j.data_day;
  if (!h || !day) throw new Error('unexpected meteoblue format');

  var nowStr = new Date().toLocaleString('sv', { timeZone: 'Asia/Yekaterinburg' }).slice(0, 16).replace('T', ' ');
  var idx = 0;
  for (var i = 0; i < h.time.length; i++) {
    if (h.time[i] <= nowStr) idx = i; else break;
  }

  var current = {
    temp: Math.round(h.temperature[idx] || 0),
    feelsLike: Math.round((h.feelsliketemperature || h.temperature)[idx] || 0),
  };

  var forecast = [];
  for (var i = 0; i < Math.min(3, day.time.length); i++) {
    var windDir = (day.winddirection || [])[i] || 0;
    forecast.push({
      day: capitalize(dayName(day.time[i])),
      max: Math.round((day.temperature_max || [])[i] || 0),
      min: Math.round((day.temperature_min || [])[i] || 0),
      windSpeed: Math.round((day.windspeed_mean || day.windspeed_max || [])[i] || 0),
      windDir: degToCompass(windDir),
      windDeg: Math.round(windDir),
      precip: Math.round(((day.precipitation || [])[i] || 0) * 10) / 10,
      precipProb: Math.round((day.precipitation_probability || [])[i] || 0),
    });
  }

  return { source: 'meteoblue', location: 'Екатеринбург', current, forecast };
}

async function geocode(city) {
  var url = 'https://geocoding-api.open-meteo.com/v1/search?name=' + encodeURIComponent(city) + '&count=1&language=ru&format=json';
  var res = await fetchWithTimeout(url, 5000);
  if (!res.ok) throw new Error('geocoding error');
  var j = await res.json();
  var r = j.results && j.results[0];
  if (!r) throw new Error('Город не найден: ' + city);
  return { lat: r.latitude, lon: r.longitude, name: r.name };
}

async function fetchOpenMeteo(lat, lon, locationName) {
  var url = (lat != null && lon != null)
    ? 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon + '&current=temperature_2m,apparent_temperature,wind_speed_10m,wind_direction_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,wind_direction_10m_dominant&timezone=auto&forecast_days=3'
    : 'https://api.open-meteo.com/v1/forecast?latitude=56.8573&longitude=60.6153&current=temperature_2m,apparent_temperature,wind_speed_10m,wind_direction_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,wind_direction_10m_dominant&timezone=Asia%2FYekaterinburg&forecast_days=3';

  var res = await fetchWithTimeout(url, 7000);
  if (!res.ok) throw new Error('open-meteo ' + res.status);
  var j = await res.json();
  var c = j.current || {};
  var daily = j.daily || {};

  var current = {
    temp: Math.round(c.temperature_2m || 0),
    feelsLike: Math.round(c.apparent_temperature || c.temperature_2m || 0),
  };

  var forecast = [];
  var times = daily.time || [];
  for (var i = 0; i < Math.min(3, times.length); i++) {
    var windDir = (daily.wind_direction_10m_dominant || [])[i] || 0;
    forecast.push({
      day: capitalize(dayName(times[i])),
      max: Math.round((daily.temperature_2m_max || [])[i] || 0),
      min: Math.round((daily.temperature_2m_min || [])[i] || 0),
      windSpeed: Math.round((daily.wind_speed_10m_max || [])[i] || 0),
      windDir: degToCompass(windDir),
      windDeg: Math.round(windDir),
      precip: Math.round(((daily.precipitation_sum || [])[i] || 0) * 10) / 10,
      precipProb: Math.round((daily.precipitation_probability_max || [])[i] || 0),
    });
  }

  return { source: 'Open-Meteo', location: locationName || 'Екатеринбург', current, forecast };
}

function makeTip(forecast) {
  if (!forecast.length) return null;
  var today = forecast[0];
  if (today.precipProb >= 60) return 'Возьмите зонт — высокая вероятность осадков.';
  if (today.windSpeed >= 10) return 'Сильный ветер, одевайтесь потеплее.';
  if (today.max <= 0) return 'Мороз, не забудьте тёплые вещи.';
  if (today.max >= 25) return 'Жарко, пейте больше воды и не забывайте солнцезащитный крем.';
  if (today.precipProb >= 30) return 'Возможен дождь, лучше взять зонт с собой.';
  return 'Хорошая погода для прогулки!';
}

function formatText(d) {
  var lines = [];
  lines.push('Источник: ' + d.source);
  lines.push(d.location);
  lines.push('Сейчас: ' + d.current.temp + '°C (ощущается как ' + d.current.feelsLike + '°C)');

  for (var f of d.forecast) {
    lines.push('');
    lines.push(f.day);
    lines.push('🌡️ День/ночь: ' + f.max + '°C / ' + f.min + '°C');
    lines.push('🌬️ Ветер: ' + f.windSpeed + ' м/с, ' + f.windDir + ' (' + f.windDeg + '°)');
    lines.push('🌧️ Осадки: ' + f.precip + ' мм (' + f.precipProb + '%)');
  }

  var tip = makeTip(d.forecast);
  if (tip) {
    lines.push('');
    lines.push('💡 Совет дня: ' + tip);
  }

  return lines.join('\n');
}

window['ai_edge_gallery_get_result'] = async function(data) {
  try {
    var params = JSON.parse(data || '{}');
    var location = (params.location || '').trim();
    var weatherData = null;

    if (isEkb(location)) {
      try {
        weatherData = await fetchMeteoblue();
      } catch(e) {
        weatherData = await fetchOpenMeteo(null, null, 'Екатеринбург');
      }
    } else {
      var geo = await geocode(location);
      weatherData = await fetchOpenMeteo(geo.lat, geo.lon, geo.name);
    }

    return JSON.stringify({ result: formatText(weatherData) });
  } catch(e) {
    return JSON.stringify({ error: 'Ошибка погоды: ' + e.message });
  }
};
</script>
</body>
</html>
