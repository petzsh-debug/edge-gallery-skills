<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Multi-Pin Map</title>
</head>
<body>
<script>
  window['ai_edge_gallery_get_result'] = async function(data, secret) {
    try {
      const params = JSON.parse(data);
      const locations = params.locations || [];
      if (locations.length === 0) {
        return JSON.stringify({ error: 'No locations provided' });
      }
      const encoded = encodeURIComponent(JSON.stringify({ locations }));
      const url = 'https://petzsh-debug.github.io/edge-gallery-skills/multi-pin-map/map.html#' + encoded;
      return JSON.stringify({ webview: { iframe: true, url: url } });
    } catch (e) {
      return JSON.stringify({ error: String(e) });
    }
  };
</script>
</body>
</html>
