<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-Pin Map</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #header {
      background: #1a73e8;
      color: white;
      padding: 10px 16px;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    #header span.count {
      background: rgba(255,255,255,0.25);
      border-radius: 12px;
      padding: 2px 8px;
      font-size: 13px;
      font-weight: 500;
    }

    #map {
      flex: 1;
      width: 100%;
    }

    #list {
      background: white;
      max-height: 180px;
      overflow-y: auto;
      border-top: 1px solid #e0e0e0;
      flex-shrink: 0;
    }

    .list-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      transition: background 0.15s;
    }

    .list-item:last-child { border-bottom: none; }
    .list-item:hover { background: #f5f8ff; }
    .list-item.active { background: #e8f0fe; }

    .pin-badge {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #1a73e8;
      color: white;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .pin-badge.error { background: #d32f2f; }
    .pin-badge.loading { background: #9e9e9e; }

    .item-text { flex: 1; min-width: 0; }
    .item-label { font-size: 13px; font-weight: 600; color: #202124; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-address { font-size: 11px; color: #5f6368; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-status { font-size: 11px; color: #9e9e9e; margin-top: 2px; }

    #error-msg {
      display: none;
      background: #fff3e0;
      color: #e65100;
      padding: 12px 16px;
      font-size: 13px;
      text-align: center;
      flex-shrink: 0;
    }

    /* Custom numbered markers */
    .numbered-marker {
      width: 28px;
      height: 28px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.35);
    }

    .numbered-marker span {
      transform: rotate(45deg);
      font-size: 11px;
      font-weight: 700;
      color: white;
    }
  </style>
</head>
<body>

<div id="header">
  📍 Multi-Pin Map
  <span class="count" id="count-badge">0 мест</span>
</div>

<div id="map"></div>
<div id="list"></div>
<div id="error-msg" id="error-msg"></div>

<!-- Leaflet JS -->
<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV/XN/WLs="
  crossorigin=""
></script>

<script>
  // ── Helpers ──────────────────────────────────────────────────────────────

  const COLORS = [
    '#1a73e8','#e53935','#43a047','#fb8c00',
    '#8e24aa','#00acc1','#f4511e','#6d4c41',
    '#546e7a','#c0ca33'
  ];

  function getColor(i) { return COLORS[i % COLORS.length]; }

  function makeIcon(index) {
    const color = getColor(index);
    const n = index + 1;
    const svg = `
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="36" viewBox="0 0 28 36">
        <path d="M14 0C6.27 0 0 6.27 0 14c0 10.5 14 22 14 22S28 24.5 28 14C28 6.27 21.73 0 14 0z"
              fill="${color}" stroke="white" stroke-width="1.5"/>
        <text x="14" y="18" text-anchor="middle" dominant-baseline="middle"
              fill="white" font-size="12" font-weight="700"
              font-family="-apple-system, BlinkMacSystemFont, sans-serif">${n}</text>
      </svg>`;
    return L.divIcon({
      html: svg,
      className: '',
      iconSize: [28, 36],
      iconAnchor: [14, 36],
      popupAnchor: [0, -36]
    });
  }

  // ── Map init ──────────────────────────────────────────────────────────────

  const map = L.map('map', { zoomControl: true });

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap',
    maxZoom: 19
  }).addTo(map);

  // ── Geocoding via Nominatim ───────────────────────────────────────────────

  async function geocode(address) {
    const url = `https://nominatim.openstreetmap.org/search?` +
      `q=${encodeURIComponent(address)}&format=json&limit=1&addressdetails=0`;
    try {
      const resp = await fetch(url, {
        headers: { 'Accept-Language': 'ru,en', 'User-Agent': 'EdgeGallerySkill/1.0' }
      });
      const data = await resp.json();
      if (data && data.length > 0) {
        return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
      }
    } catch (e) { /* network error */ }
    return null;
  }

  // ── Main logic ────────────────────────────────────────────────────────────

  async function run(locations) {
    const countBadge = document.getElementById('count-badge');
    const listEl = document.getElementById('list');
    const errorEl = document.getElementById('error-msg');

    countBadge.textContent = `${locations.length} ${plural(locations.length)}`;

    // Build list items immediately
    const items = locations.map((loc, i) => {
      const div = document.createElement('div');
      div.className = 'list-item';
      div.dataset.index = i;
      div.innerHTML = `
        <div class="pin-badge loading" id="badge-${i}" style="background:${getColor(i)}">${i+1}</div>
        <div class="item-text">
          <div class="item-label">${escHtml(loc.label || loc.address)}</div>
          <div class="item-address">${escHtml(loc.address)}</div>
          <div class="item-status" id="status-${i}">Поиск на карте…</div>
        </div>`;
      listEl.appendChild(div);
      return div;
    });

    // Geocode all in parallel
    const markers = [];
    const bounds = [];

    const results = await Promise.all(
      locations.map(loc => geocode(loc.address))
    );

    results.forEach((coords, i) => {
      const statusEl = document.getElementById(`status-${i}`);
      const badgeEl  = document.getElementById(`badge-${i}`);
      const listItem = items[i];

      if (!coords) {
        statusEl.textContent = '⚠ Адрес не найден';
        badgeEl.classList.add('error');
        badgeEl.style.background = '#d32f2f';
        return;
      }

      statusEl.textContent = `${coords.lat.toFixed(4)}, ${coords.lon.toFixed(4)}`;

      const marker = L.marker([coords.lat, coords.lon], { icon: makeIcon(i) })
        .addTo(map)
        .bindPopup(`<b>${escHtml(locations[i].label || locations[i].address)}</b><br>${escHtml(locations[i].address)}`);

      markers.push(marker);
      bounds.push([coords.lat, coords.lon]);

      // Click list item → open popup
      listItem.addEventListener('click', () => {
        document.querySelectorAll('.list-item').forEach(el => el.classList.remove('active'));
        listItem.classList.add('active');
        map.setView([coords.lat, coords.lon], 15, { animate: true });
        marker.openPopup();
      });
    });

    if (bounds.length > 0) {
      if (bounds.length === 1) {
        map.setView(bounds[0], 14);
      } else {
        map.fitBounds(bounds, { padding: [40, 40] });
      }
    } else {
      // Fallback: world view
      map.setView([20, 0], 2);
      errorEl.style.display = 'block';
      errorEl.textContent = 'Не удалось найти ни один адрес. Проверьте подключение к интернету.';
    }
  }

  function plural(n) {
    if (n % 10 === 1 && n % 100 !== 11) return 'место';
    if ([2,3,4].includes(n % 10) && ![12,13,14].includes(n % 100)) return 'места';
    return 'мест';
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Entry point ───────────────────────────────────────────────────────────
  // Gallery passes skill data via window.skillData
  // During local testing you can set window.skillData manually below

  function tryParse(str) {
    try { return JSON.parse(str); } catch(e) { return null; }
  }

  function extractData() {
    // 1. window.skillData / window.skillInput / window.SKILL_DATA
    for (const key of ['skillData', 'skillInput', 'SKILL_DATA', 'SKILL_INPUT', 'skill_data']) {
      if (window[key]) return window[key];
    }

    // 2. URL search params: ?data=... or ?input=... or ?skillData=...
    const params = new URLSearchParams(location.search);
    for (const key of ['data', 'input', 'skillData', 'skillInput', 'q']) {
      const val = params.get(key);
      if (val) {
        const parsed = tryParse(decodeURIComponent(val));
        if (parsed) return parsed;
      }
    }

    // 3. Entire query string as JSON (some apps pass raw JSON as ?{...})
    if (location.search.length > 1) {
      const raw = decodeURIComponent(location.search.slice(1));
      const parsed = tryParse(raw);
      if (parsed) return parsed;
    }

    // 4. URL hash
    if (location.hash.length > 1) {
      const parsed = tryParse(decodeURIComponent(location.hash.slice(1)));
      if (parsed) return parsed;
    }

    return null;
  }

  function startWithData(data) {
    if (!data || !data.locations || data.locations.length === 0) {
      document.getElementById('error-msg').style.display = 'block';
      document.getElementById('error-msg').textContent = 'Нет адресов для отображения.';
      map.setView([20, 0], 2);
      return;
    }
    run(data.locations);
  }

  window.addEventListener('load', () => {
    const data = extractData();

    if (data) {
      startWithData(data);
      return;
    }

    // Listen for postMessage (some webview containers send data this way)
    window.addEventListener('message', (event) => {
      let payload = event.data;
      if (typeof payload === 'string') payload = tryParse(payload);
      if (payload && payload.locations) startWithData(payload);
    });

    // Hardcoded demo if nothing passed (for local preview)
    startWithData({
      locations: [
        { label: "Красная площадь", address: "Красная площадь, Москва" },
        { label: "Эрмитаж",         address: "Дворцовая площадь 2, Санкт-Петербург" },
        { label: "Третьяковская галерея", address: "Лаврушинский переулок 10, Москва" }
      ]
    });
  });
</script>
</body>
</html>
