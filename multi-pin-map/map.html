<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-Pin Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f0f2f5; height: 100vh; display: flex; flex-direction: column; }
    #header { background: #1a73e8; color: white; padding: 10px 16px; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    #header .count { background: rgba(255,255,255,0.25); border-radius: 12px; padding: 2px 8px; font-size: 13px; }
    #map { flex: 1; width: 100%; }
    #list { background: white; max-height: 180px; overflow-y: auto; border-top: 1px solid #e0e0e0; flex-shrink: 0; }
    .list-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 16px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
    .list-item:last-child { border-bottom: none; }
    .list-item:hover { background: #f5f8ff; }
    .list-item.active { background: #e8f0fe; }
    .pin-badge { width: 24px; height: 24px; border-radius: 50%; color: white; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
    .item-text { flex: 1; min-width: 0; }
    .item-label { font-size: 13px; font-weight: 600; color: #202124; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-address { font-size: 11px; color: #5f6368; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-status { font-size: 11px; color: #9e9e9e; margin-top: 2px; }
    #error-msg { display: none; background: #fff3e0; color: #e65100; padding: 12px 16px; font-size: 13px; text-align: center; flex-shrink: 0; }
  </style>
</head>
<body>
<div id="header">📍 Multi-Pin Map <span class="count" id="count-badge">0 мест</span></div>
<div id="map"></div>
<div id="list"></div>
<div id="error-msg"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV/XN/WLs=" crossorigin=""></script>
<script>
  const COLORS = ['#1a73e8','#e53935','#43a047','#fb8c00','#8e24aa','#00acc1','#f4511e','#6d4c41'];

  function makeIcon(i) {
    const color = COLORS[i % COLORS.length];
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="36" viewBox="0 0 28 36">
      <path d="M14 0C6.27 0 0 6.27 0 14c0 10.5 14 22 14 22S28 24.5 28 14C28 6.27 21.73 0 14 0z" fill="${color}" stroke="white" stroke-width="1.5"/>
      <text x="14" y="18" text-anchor="middle" dominant-baseline="middle" fill="white" font-size="12" font-weight="700" font-family="sans-serif">${i+1}</text>
    </svg>`;
    return L.divIcon({ html: svg, className: '', iconSize: [28,36], iconAnchor: [14,36], popupAnchor: [0,-36] });
  }

  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function plural(n) {
    if (n % 10 === 1 && n % 100 !== 11) return 'место';
    if ([2,3,4].includes(n % 10) && ![12,13,14].includes(n % 100)) return 'места';
    return 'мест';
  }

  async function geocode(address) {
    try {
      const resp = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(address)}&format=json&limit=1`,
        { headers: { 'Accept-Language': 'ru,en', 'User-Agent': 'EdgeGallerySkill/1.0' } });
      const data = await resp.json();
      if (data && data[0]) return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
    } catch(e) {}
    return null;
  }

  async function run(locations) {
    document.getElementById('count-badge').textContent = `${locations.length} ${plural(locations.length)}`;
    const listEl = document.getElementById('list');
    const map = L.map('map');
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap', maxZoom: 19 }).addTo(map);

    const items = locations.map((loc, i) => {
      const div = document.createElement('div');
      div.className = 'list-item';
      div.innerHTML = `
        <div class="pin-badge" style="background:${COLORS[i % COLORS.length]}">${i+1}</div>
        <div class="item-text">
          <div class="item-label">${esc(loc.label || loc.address)}</div>
          <div class="item-address">${esc(loc.address)}</div>
          <div class="item-status" id="s${i}">Поиск…</div>
        </div>`;
      listEl.appendChild(div);
      return div;
    });

    const results = await Promise.all(locations.map(loc => geocode(loc.address)));
    const bounds = [];

    results.forEach((coords, i) => {
      const statusEl = document.getElementById(`s${i}`);
      if (!coords) { statusEl.textContent = '⚠ Не найден'; return; }
      statusEl.textContent = `${coords.lat.toFixed(4)}, ${coords.lon.toFixed(4)}`;
      const marker = L.marker([coords.lat, coords.lon], { icon: makeIcon(i) }).addTo(map)
        .bindPopup(`<b>${esc(locations[i].label || locations[i].address)}</b><br>${esc(locations[i].address)}`);
      bounds.push([coords.lat, coords.lon]);
      items[i].addEventListener('click', () => {
        document.querySelectorAll('.list-item').forEach(el => el.classList.remove('active'));
        items[i].classList.add('active');
        map.setView([coords.lat, coords.lon], 15, { animate: true });
        marker.openPopup();
      });
    });

    if (bounds.length === 0) {
      map.setView([20, 0], 2);
      const err = document.getElementById('error-msg');
      err.style.display = 'block';
      err.textContent = 'Не удалось найти адреса. Проверьте интернет.';
    } else if (bounds.length === 1) {
      map.setView(bounds[0], 14);
    } else {
      map.fitBounds(bounds, { padding: [40, 40] });
    }
  }

  window.addEventListener('load', () => {
    let data = null;
    if (location.hash.length > 1) {
      try { data = JSON.parse(decodeURIComponent(location.hash.slice(1))); } catch(e) {}
    }
    if (!data) {
      // Demo mode
      data = { locations: [
        { label: "Красная площадь", address: "Красная площадь, Москва, Россия" },
        { label: "Эрмитаж", address: "Дворцовая площадь 2, Санкт-Петербург, Россия" },
        { label: "Третьяковская галерея", address: "Лаврушинский переулок 10, Москва, Россия" }
      ]};
    }
    run(data.locations);
  });
</script>
</body>
</html>
