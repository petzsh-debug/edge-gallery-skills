<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Multi-Pin Map</title></head>
<body>
<script>
window['ai_edge_gallery_get_result'] = async function(data) {
  try {
    const params = JSON.parse(data);
    const locations = params.locations || [];
    if (!locations.length) return JSON.stringify({ error: 'No locations provided' });

    // Pass addresses directly to map.html — geocoding happens there progressively
    const encoded = encodeURIComponent(JSON.stringify({ locations }));
    const url = 'https://petzsh-debug.github.io/edge-gallery-skills/multi-pin-map/scripts/map.html?v=' + Date.now() + '#' + encoded;
    return JSON.stringify({ webview: { iframe: true, url: url, aspectRatio: 1.5 } });
  } catch(e) {
    return JSON.stringify({ error: String(e) });
  }
};
</script>
</body>
</html>
