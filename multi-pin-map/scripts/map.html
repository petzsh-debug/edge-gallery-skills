<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Multi-Pin Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;width:100%;overflow:hidden}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f0f2f5;display:flex;flex-direction:column}

    #header{background:#1a73e8;color:white;padding:10px 16px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;flex-shrink:0;min-height:44px}
    .count{background:rgba(255,255,255,.25);border-radius:12px;padding:2px 8px;font-size:13px}
    #share-btn{margin-left:auto;background:rgba(255,255,255,.2);border:none;color:white;border-radius:20px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px}
    #share-btn:active{background:rgba(255,255,255,.35)}

    #map{flex:1;width:100%;min-height:200px}

    #list{background:white;max-height:160px;overflow-y:auto;border-top:1px solid #e0e0e0;flex-shrink:0}
    .item{display:flex;align-items:flex-start;gap:10px;padding:10px 16px;border-bottom:1px solid #f0f0f0;cursor:pointer}
    .item:last-child{border-bottom:none}
    .item:active{background:#e8f0fe}
    .badge{width:24px;height:24px;border-radius:50%;color:white;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
    .lbl{font-size:13px;font-weight:600;color:#202124;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .adr{font-size:11px;color:#5f6368;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .note{font-size:11px;color:#9e9e9e;margin-top:2px}

    /* Bottom sheet */
    #sheet-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000}
    #sheet-overlay.open{display:block}
    #sheet{position:fixed;bottom:0;left:0;right:0;background:white;border-radius:16px 16px 0 0;padding:12px 0 24px;z-index:1001;transform:translateY(100%);transition:transform .25s ease}
    #sheet-overlay.open #sheet{transform:translateY(0)}
    .sheet-handle{width:36px;height:4px;background:#e0e0e0;border-radius:2px;margin:0 auto 16px}
    .sheet-title{font-size:13px;color:#9e9e9e;padding:0 20px 8px;font-weight:500}
    .sheet-btn{display:flex;align-items:center;gap:14px;padding:14px 20px;font-size:15px;color:#202124;cursor:pointer;border:none;background:none;width:100%;text-align:left}
    .sheet-btn:active{background:#f5f5f5}
    .sheet-icon{font-size:22px;width:32px;text-align:center}
    .sheet-label{flex:1}
    .sheet-sub{font-size:12px;color:#9e9e9e;margin-top:1px}

    /* Copy dialog */
    #copy-overlay,#maps-menu{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:2000;align-items:flex-end}
    .dialog{background:white;border-radius:16px 16px 0 0;padding:16px;width:100%;max-height:80vh;display:flex;flex-direction:column;gap:10px}
    .dialog-title{font-size:15px;font-weight:600;color:#202124}
    .dialog-sub{font-size:12px;color:#9e9e9e}
    #copy-area{width:100%;height:120px;border:1px solid #e0e0e0;border-radius:8px;padding:8px;font-size:11px;font-family:monospace;resize:none;color:#555}
    .dialog-row{display:flex;gap:8px}
    .btn-primary{flex:1;background:#1a73e8;color:white;border:none;border-radius:8px;padding:12px;font-size:14px;font-weight:600;cursor:pointer}
    .btn-secondary{flex:1;background:#f0f0f0;color:#333;border:none;border-radius:8px;padding:12px;font-size:14px;cursor:pointer}
    #maps-list{overflow-y:auto;max-height:50vh}
  </style>
</head>
<body>

<div id="header">
  📍 Multi-Pin Map <span class="count" id="cnt">…</span>
  <button id="share-btn" onclick="openSheet()">↑ Экспорт</button>
</div>
<div id="map"></div>
<div id="list"></div>

<!-- Bottom sheet -->
<div id="sheet-overlay" onclick="closeSheet(event)">
  <div id="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Экспорт точек</div>

    <button class="sheet-btn" onclick="doShare()">
      <span class="sheet-icon">📤</span>
      <div class="sheet-label">
        Поделиться
        <div class="sheet-sub">GPX файл → Organic Maps, OsmAnd, Telegram…</div>
      </div>
    </button>

    <button class="sheet-btn" onclick="doDownload()">
      <span class="sheet-icon">⬇️</span>
      <div class="sheet-label">
        Скачать GPX
        <div class="sheet-sub">Открыть потом в любом приложении</div>
      </div>
    </button>

    <button class="sheet-btn" onclick="doOpenMaps()">
      <span class="sheet-icon">🗺️</span>
      <div class="sheet-label">
        Открыть в картах
        <div class="sheet-sub">Первая точка в Organic Maps / Google Maps</div>
      </div>
    </button>
  </div>
</div>

<!-- Copy GPX dialog -->
<div id="copy-overlay" onclick="if(event.target===this)this.style.display='none'">
  <div class="dialog">
    <div class="dialog-title">GPX файл</div>
    <div class="dialog-sub">Скопируйте и вставьте в файл points.gpx, или отправьте через мессенджер</div>
    <textarea id="copy-area" readonly></textarea>
    <div class="dialog-row">
      <button class="btn-secondary" onclick="document.getElementById('copy-overlay').style.display='none'">Закрыть</button>
      <button class="btn-primary" id="copy-btn" onclick="copyGpx()">Копировать GPX</button>
    </div>
  </div>
</div>

<!-- Open in maps: pick pin -->
<div id="maps-menu" onclick="if(event.target===this)this.style.display='none'">
  <div class="dialog">
    <div class="dialog-title">Выберите точку</div>
    <div id="maps-list"></div>
    <button class="btn-secondary" onclick="document.getElementById('maps-menu').style.display='none'">Закрыть</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const COLORS=['#1a73e8','#e53935','#43a047','#fb8c00','#8e24aa','#00acc1','#f4511e','#6d4c41'];
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function escXml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function plural(n){if(n%10===1&&n%100!==11)return'место';if([2,3,4].includes(n%10)&&![12,13,14].includes(n%100))return'места';return'мест'}

function makeIcon(i,done){
  const c=done?COLORS[i%COLORS.length]:'#aaa';
  return L.divIcon({
    html:`<svg xmlns="http://www.w3.org/2000/svg" width="28" height="36" viewBox="0 0 28 36"><path d="M14 0C6.27 0 0 6.27 0 14c0 10.5 14 22 14 22S28 24.5 28 14C28 6.27 21.73 0 14 0z" fill="${c}" stroke="white" stroke-width="1.5"/><text x="14" y="18" text-anchor="middle" dominant-baseline="middle" fill="white" font-size="12" font-weight="700" font-family="sans-serif">${i+1}</text></svg>`,
    className:'',iconSize:[28,36],iconAnchor:[14,36],popupAnchor:[0,-36]
  });
}

// ── Geocoding ─────────────────────────────────────────────────────────────────
async function geocode(address){
  const hdrs={'Accept-Language':'ru,en','User-Agent':'EdgeGallerySkill/1.0'};
  try{
    const q=encodeURIComponent(address+', Екатеринбург');
    const data=await(await fetch('https://photon.komoot.io/api/?q='+q+'&limit=5&lat=56.838&lon=60.597&lang=ru',{headers:hdrs})).json();
    if(data&&data.features&&data.features.length){
      const withHouse=data.features.find(f=>f.properties&&f.properties.housenumber);
      const pick=(withHouse||data.features[0]).geometry.coordinates;
      if(pick) return{lat:pick[1],lon:pick[0]};
    }
  }catch(e){}
  const base='https://nominatim.openstreetmap.org/search?format=json&limit=10&countrycodes=ru';
  for(const q of[address+', Екатеринбург',address+', Свердловская область',address]){
    try{
      const results=await(await fetch(base+'&q='+encodeURIComponent(q),{headers:hdrs})).json();
      if(!results||!results.length) continue;
      const ekb=results.find(r=>r.display_name&&(r.display_name.includes('Екатеринбург')||r.display_name.includes('Ekaterinburg')));
      const pick=ekb||results[0];
      const lat=parseFloat(pick.lat),lon=parseFloat(pick.lon);
      if(!isNaN(lat)&&!isNaN(lon)) return{lat,lon};
    }catch(e){}
  }
  return null;
}

// ── GPX generation ────────────────────────────────────────────────────────────
function buildGpx(foundPins){
  const wpts=foundPins.map(p=>
    `  <wpt lat="${p.lat}" lon="${p.lon}">\n    <name>${escXml(p.label)}</name>\n    <desc>${escXml(p.address)}</desc>\n  </wpt>`
  ).join('\n');
  return `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Multi-Pin Map" xmlns="http://www.topografix.com/GPX/1/1">\n${wpts}\n</gpx>`;
}

function makeGpxFile(foundPins){
  const gpx=buildGpx(foundPins);
  return new File([gpx],'points.gpx',{type:'application/gpx+xml'});
}

// ── Export actions ────────────────────────────────────────────────────────────
let foundPins=[];

function openSheet(){document.getElementById('sheet-overlay').classList.add('open')}
function closeSheet(e){
  if(e.target===document.getElementById('sheet-overlay')||e===true)
    document.getElementById('sheet-overlay').classList.remove('open');
}

function getReady(){return foundPins.filter(p=>p.lat!=null);}

// Share: GPX файл через Web Share API (работает в Android WebView)
async function doShare(){
  closeSheet(true);
  const ready=getReady();
  if(!ready.length){alert('Подождите, адреса ещё загружаются');return;}
  if(!navigator.share){showCopyDialog(buildGpx(ready));return;}
  // Сначала пробуем поделиться файлом
  try{
    const file=makeGpxFile(ready);
    await navigator.share({title:'Точки на карте',files:[file]});
    return;
  }catch(e){if(e.name==='AbortError')return;}
  // Файл не поддерживается — шарим как текст
  try{
    await navigator.share({title:'points.gpx',text:buildGpx(ready)});
    return;
  }catch(e){if(e.name==='AbortError')return;}
  showCopyDialog(buildGpx(ready));
}

// Download: в Android WebView blob-download не работает, поэтому используем share
async function doDownload(){
  closeSheet(true);
  const ready=getReady();
  if(!ready.length){alert('Подождите, адреса ещё загружаются');return;}
  const gpx=buildGpx(ready);
  // Пробуем скачать через <a download> (работает в десктопных браузерах)
  try{
    const blob=new Blob([gpx],{type:'application/gpx+xml'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='points.gpx';
    document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},500);
    // Если через 1 сек ничего не произошло (WebView) — показываем share/copy
    await new Promise(r=>setTimeout(r,800));
  }catch(e){}
  // Fallback для WebView: share или copy
  if(navigator.share){
    try{
      const file=makeGpxFile(ready);
      await navigator.share({title:'Точки на карте',files:[file]});
      return;
    }catch(e){if(e.name==='AbortError')return;}
    try{
      await navigator.share({title:'points.gpx',text:gpx});
      return;
    }catch(e){if(e.name==='AbortError')return;}
  }
  showCopyDialog(gpx);
}

function showCopyDialog(text){
  const overlay=document.getElementById('copy-overlay');
  document.getElementById('copy-area').value=text;
  overlay.style.display='flex';
}

async function copyGpx(){
  const text=document.getElementById('copy-area').value;
  try{
    await navigator.clipboard.writeText(text);
    document.getElementById('copy-btn').textContent='Скопировано ✓';
    setTimeout(()=>{document.getElementById('copy-btn').textContent='Копировать GPX';},2000);
  }catch(e){
    document.getElementById('copy-area').select();
  }
}

// Open in maps: geo: URI opens default maps app, om:// opens Organic Maps
function doOpenMaps(){
  closeSheet(true);
  const ready=getReady();
  if(!ready.length){alert('Подождите, адреса ещё загружаются');return;}
  // Show list of all pins
  const menu=document.getElementById('maps-menu');
  const list=document.getElementById('maps-list');
  list.innerHTML='';
  ready.forEach(p=>{
    const btn=document.createElement('button');
    btn.className='sheet-btn';
    btn.innerHTML=`<span class="sheet-icon">📍</span><div class="sheet-label">${esc(p.label)}<div class="sheet-sub">${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}</div></div>`;
    btn.onclick=()=>{
      menu.style.display='none';
      window.open(`https://maps.google.com/maps?q=${p.lat},${p.lon}`,'_blank');
    };
    list.appendChild(btn);
  });
  menu.style.display='flex';
}

// ── Main ──────────────────────────────────────────────────────────────────────
window.addEventListener('load',()=>{
  let data=null;
  if(location.hash.length>1){try{data=JSON.parse(decodeURIComponent(location.hash.slice(1)))}catch(e){}}

  const locations=data&&data.locations?data.locations:[
    {label:'Красная площадь',address:'Красная площадь, Москва, Россия'},
    {label:'Эрмитаж',address:'Дворцовая площадь 2, Санкт-Петербург, Россия'},
    {label:'Третьяковская галерея',address:'Лаврушинский переулок 10, Москва, Россия'}
  ];

  // Init foundPins array (filled as geocoding completes)
  foundPins=locations.map(loc=>({label:loc.label||loc.address,address:loc.address,lat:null,lon:null}));

  document.getElementById('cnt').textContent=`${locations.length} ${plural(locations.length)}`;

  const map=L.map('map',{zoomControl:true});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19}).addTo(map);
  map.setView([56.838,60.597],12);
  setTimeout(()=>map.invalidateSize(),200);
  window.addEventListener('resize',()=>map.invalidateSize());

  const listEl=document.getElementById('list');
  const bounds=[];

  const items=locations.map((loc,i)=>{
    const div=document.createElement('div');
    div.className='item';
    div.innerHTML=`<div class="badge" style="background:#aaa" id="b${i}">${i+1}</div>`+
      `<div style="flex:1;min-width:0"><div class="lbl">${esc(loc.label||loc.address)}</div>`+
      `<div class="adr">${esc(loc.address)}</div>`+
      `<div class="note" id="s${i}">Поиск…</div></div>`;
    listEl.appendChild(div);
    return div;
  });

  locations.forEach(async(loc,i)=>{
    const coords=await geocode(loc.address);
    const statusEl=document.getElementById('s'+i);
    const badgeEl=document.getElementById('b'+i);

    if(!coords){statusEl.textContent='⚠ Не найден';return;}

    statusEl.textContent=coords.lat.toFixed(4)+', '+coords.lon.toFixed(4);
    badgeEl.style.background=COLORS[i%COLORS.length];
    foundPins[i].lat=coords.lat;
    foundPins[i].lon=coords.lon;

    const m=L.marker([coords.lat,coords.lon],{icon:makeIcon(i,true)}).addTo(map)
      .bindPopup(`<b>${esc(loc.label||loc.address)}</b><br><small>${esc(loc.address)}</small>`);

    bounds.push([coords.lat,coords.lon]);
    items[i].addEventListener('click',()=>{
      document.querySelectorAll('.item').forEach(el=>el.classList.remove('active'));
      items[i].classList.add('active');
      map.setView([coords.lat,coords.lon],15,{animate:true});
      m.openPopup();
    });

    if(bounds.length===1) map.setView(bounds[0],14);
    else map.fitBounds(bounds,{padding:[40,40]});
  });
});
</script>
</body>
</html>
