<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<script>
const METEOBLUE_URL = 'https://my.meteoblue.com/packages/basic-1h_basic-day?apikey=uf7AWT0t9lb3IeqZ&lat=56.8573&lon=60.6153&asl=278&format=json';
const OPENMETEO_EKB = 'https://api.open-meteo.com/v1/forecast?latitude=56.8573&longitude=60.6153&current=temperature_2m,apparent_temperature,wind_speed_10m,wind_direction_10m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,wind_direction_10m_dominant,weather_code&timezone=Asia%2FYekaterinburg&forecast_days=3';

function isEkb(loc) {
  if (!loc) return true;
  const s = loc.toLowerCase().trim();
  return !s || s.includes('екатер') || s.includes('yekater') || s.includes('ekater') || s === 'екб' || s === 'ekb';
}

function degToCompass(deg) {
  const d = ['С','СВ','В','ЮВ','Ю','ЮЗ','З','СЗ'];
  return d[Math.round((deg % 360) / 45) % 8];
}

function wmoEmoji(code) {
  if (code === 0) return '☀️';
  if (code <= 3) return '⛅';
  if (code <= 48) return '🌫️';
  if (code <= 57) return '🌦️';
  if (code <= 67) return '🌧️';
  if (code <= 77) return '🌨️';
  if (code <= 82) return '🌧️';
  if (code <= 86) return '🌨️';
  return '⛈️';
}

function pictoEmoji(code) {
  if (code <= 2) return '☀️';
  if (code <= 4) return '⛅';
  if (code === 5) return '☁️';
  if (code === 6) return '🌫️';
  if (code <= 9) return '🌧️';
  if (code <= 11) return '🌨️';
  if (code <= 14) return '⛈️';
  return '🌨️';
}

function dayName(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('ru', { weekday: 'short' });
}

async function fetchMeteoblue() {
  const res = await fetch(METEOBLUE_URL, { signal: AbortSignal.timeout(7000) });
  if (!res.ok) throw new Error('meteoblue ' + res.status);
  const j = await res.json();
  const h = j.data_1h;
  const day = j.data_day;
  if (!h || !day) throw new Error('unexpected meteoblue format');

  // Find current hour index (times are in local Yekaterinburg time)
  const nowStr = new Date().toLocaleString('sv', { timeZone: 'Asia/Yekaterinburg' }).slice(0, 16).replace('T', ' ');
  let idx = 0;
  for (let i = 0; i < h.time.length; i++) {
    if (h.time[i] <= nowStr) idx = i;
    else break;
  }

  const current = {
    temp: Math.round(h.temperature[idx] ?? 0),
    feelsLike: Math.round((h.feelsliketemperature ?? h.temperature)[idx] ?? h.temperature[idx] ?? 0),
    windSpeed: Math.round((h.windspeed ?? [])[idx] ?? 0),
    windDir: degToCompass((h.winddirection ?? [])[idx] ?? 0),
    emoji: pictoEmoji((h.pictocode ?? [])[idx] ?? 1),
  };

  const forecast = [];
  for (let i = 0; i < Math.min(3, day.time.length); i++) {
    forecast.push({
      day: dayName(day.time[i]),
      emoji: pictoEmoji((day.pictocode ?? [])[i] ?? 1),
      max: Math.round((day.temperature_max ?? [])[i] ?? 0),
      min: Math.round((day.temperature_min ?? [])[i] ?? 0),
      precip: Math.round(((day.precipitation ?? [])[i] ?? 0) * 10) / 10,
      precipProb: Math.round((day.precipitation_probability ?? [])[i] ?? 0),
      windSpeed: Math.round((day.windspeed_mean ?? [])[i] ?? 0),
      windDir: degToCompass((day.winddirection ?? [])[i] ?? 0),
    });
  }

  return { source: 'Meteoblue', location: 'Екатеринбург', current, forecast };
}

async function fetchOpenMeteo(lat, lon, locationName) {
  const url = (lat != null && lon != null)
    ? `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,wind_speed_10m,wind_direction_10m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,wind_direction_10m_dominant,weather_code&timezone=auto&forecast_days=3`
    : OPENMETEO_EKB;

  const res = await fetch(url, { signal: AbortSignal.timeout(7000) });
  if (!res.ok) throw new Error('open-meteo ' + res.status);
  const j = await res.json();
  const c = j.current ?? {};
  const daily = j.daily ?? {};

  const current = {
    temp: Math.round(c.temperature_2m ?? 0),
    feelsLike: Math.round(c.apparent_temperature ?? c.temperature_2m ?? 0),
    windSpeed: Math.round(c.wind_speed_10m ?? 0),
    windDir: degToCompass(c.wind_direction_10m ?? 0),
    emoji: wmoEmoji(c.weather_code ?? 0),
  };

  const forecast = [];
  const times = daily.time ?? [];
  for (let i = 0; i < Math.min(3, times.length); i++) {
    forecast.push({
      day: dayName(times[i]),
      emoji: wmoEmoji((daily.weather_code ?? [])[i] ?? 0),
      max: Math.round((daily.temperature_2m_max ?? [])[i] ?? 0),
      min: Math.round((daily.temperature_2m_min ?? [])[i] ?? 0),
      precip: Math.round(((daily.precipitation_sum ?? [])[i] ?? 0) * 10) / 10,
      precipProb: Math.round((daily.precipitation_probability_max ?? [])[i] ?? 0),
      windSpeed: Math.round((daily.wind_speed_10m_max ?? [])[i] ?? 0),
      windDir: degToCompass((daily.wind_direction_10m_dominant ?? [])[i] ?? 0),
    });
  }

  return { source: 'Open-Meteo', location: locationName || 'Екатеринбург', current, forecast };
}

async function geocode(city) {
  const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=ru&format=json`;
  const res = await fetch(url, { signal: AbortSignal.timeout(5000) });
  if (!res.ok) throw new Error('geocoding error');
  const j = await res.json();
  const r = j.results?.[0];
  if (!r) throw new Error('Город не найден: ' + city);
  return { lat: r.latitude, lon: r.longitude, name: r.name };
}

window['ai_edge_gallery_get_result'] = async function(data) {
  try {
    const params = JSON.parse(data || '{}');
    const location = (params.location || '').trim();

    let weatherData = null;

    if (isEkb(location)) {
      try {
        weatherData = await fetchMeteoblue();
      } catch(e) {
        console.warn('Meteoblue failed:', e.message);
        weatherData = await fetchOpenMeteo(null, null, 'Екатеринбург');
      }
    } else {
      const geo = await geocode(location);
      weatherData = await fetchOpenMeteo(geo.lat, geo.lon, geo.name);
    }

    const encoded = encodeURIComponent(JSON.stringify(weatherData));
    const url = 'weather.html?v=' + Date.now() + '#' + encoded;
    return JSON.stringify({ webview: { url, aspectRatio: 1.6 } });
  } catch(e) {
    return JSON.stringify({ error: 'Ошибка погоды: ' + e.message });
  }
};
</script>
</body>
</html>
